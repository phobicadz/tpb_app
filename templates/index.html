<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TPB Search</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="hero">
        <h1>🏴‍☠️ Pirate Bay Search</h1>
        <p>Find the best torrents, fast</p>
        <form action="/search" method="GET">
            <div class="search-box">
                <input type="text" name="q" placeholder="Search for torrents..." required>
                <button type="submit">Search</button>
            </div>
        </form>
        <p class="hint">Powered by apibay.org</p>
    </div>
</body>
</html>
